name: Build Touch Guard APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Generate the complete Android project from this one workflow file
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/example/touchguard

          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "TouchGuard"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.6.1" apply false
              id("org.jetbrains.kotlin.android") version "2.0.20" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.touchguard"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.example.touchguard"
                  minSdk = 23
                  targetSdk = 28
                  versionCode = 1
                  versionName = "1.0"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <application android:allowBackup="false" android:label="Touch Guard" android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".OverlayService" android:exported="false" />
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/touchguard/MainActivity.kt <<'EOF'
          package com.example.touchguard

          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(28, 28, 28, 28)
                  }
                  layout.addView(TextView(this).apply { text = "Touch Guard"; textSize = 26f })
                  layout.addView(TextView(this).apply {
                      text = "Tap the floating handle to toggle touch blocking. Android system UI and navigation may still work."
                      textSize = 16f
                      setPadding(0, 18, 0, 24)
                  })
                  layout.addView(Button(this).apply {
                      text = "Allow display over other apps"
                      setOnClickListener {
                          startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                      }
                  }, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT))
                  layout.addView(Button(this).apply {
                      text = "Start floating control"
                      setOnClickListener {
                          if (Settings.canDrawOverlays(this@MainActivity)) {
                              startService(Intent(this@MainActivity, OverlayService::class.java))
                              finish()
                          } else {
                              startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                          }
                      }
                  }, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT))
                  setContentView(layout)
              }
          }
          EOF

          cat > app/src/main/java/com/example/touchguard/OverlayService.kt <<'EOF'
          package com.example.touchguard

          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.os.IBinder
          import android.view.*
          import android.widget.TextView
          import kotlin.math.abs

          class OverlayService : Service() {
              private lateinit var wm: WindowManager
              private var blocker: View? = null
              private var bubble: TextView? = null
              private var blocked = false
              private var bubbleParams: WindowManager.LayoutParams? = null

              override fun onCreate() {
                  super.onCreate()
                  wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  val channel = "touch_guard"
                  if (Build.VERSION.SDK_INT >= 26) {
                      getSystemService(NotificationManager::class.java).createNotificationChannel(
                          NotificationChannel(channel, "Touch Guard", NotificationManager.IMPORTANCE_LOW)
                      )
                  }
                  val nb = if (Build.VERSION.SDK_INT >= 26) Notification.Builder(this, channel) else Notification.Builder(this)
                  startForeground(42, nb.setContentTitle("Touch Guard running")
                      .setContentText("Use the floating handle to toggle touch blocking")
                      .setSmallIcon(android.R.drawable.ic_lock_idle_lock).setOngoing(true).build())
                  showBubble()
              }

              private fun dp(n: Int) = (n * resources.displayMetrics.density).toInt()
              private fun type() = if (Build.VERSION.SDK_INT >= 26)
                  WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY else WindowManager.LayoutParams.TYPE_PHONE
              private fun bg(color: Int) = GradientDrawable().apply {
                  shape = GradientDrawable.OVAL
                  setColor(color)
                  setStroke(2, Color.WHITE)
              }

              private fun showBubble() {
                  val b = TextView(this).apply {
                      text = "TG"
                      textSize = 15f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      alpha = .75f
                      background = bg(Color.rgb(30, 105, 190))
                  }
                  val p = WindowManager.LayoutParams(dp(54), dp(54), type(),
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = dp(12)
                      y = dp(180)
                  }
                  bubbleParams = p
                  bubble = b
                  b.setOnTouchListener(object : View.OnTouchListener {
                      var x0 = 0
                      var y0 = 0
                      var sx = 0
                      var sy = 0
                      var dragged = false
                      override fun onTouch(v: View, e: MotionEvent): Boolean {
                          when (e.action) {
                              MotionEvent.ACTION_DOWN -> {
                                  x0 = e.rawX.toInt(); y0 = e.rawY.toInt()
                                  sx = p.x; sy = p.y; dragged = false
                                  return true
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  val dx = e.rawX.toInt() - x0
                                  val dy = e.rawY.toInt() - y0
                                  if (abs(dx) > 5 || abs(dy) > 5) dragged = true
                                  p.x = sx + dx; p.y = sy + dy
                                  try { wm.updateViewLayout(v, p) } catch (_: Exception) {}
                                  return true
                              }
                              MotionEvent.ACTION_UP -> {
                                  if (!dragged) toggle()
                                  return true
                              }
                          }
                          return true
                      }
                  })
                  wm.addView(b, p)
              }

              private fun toggle() {
                  if (blocked) {
                      blocker?.let { try { wm.removeView(it) } catch (_: Exception) {} }
                      blocker = null
                      blocked = false
                  } else {
                      val v = View(this).apply {
                          setBackgroundColor(Color.TRANSPARENT)
                          setOnTouchListener { _, _ -> true }
                      }
                      val p = WindowManager.LayoutParams(
                          WindowManager.LayoutParams.MATCH_PARENT,
                          WindowManager.LayoutParams.MATCH_PARENT,
                          type(),
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                              WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                              WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON,
                          PixelFormat.TRANSLUCENT
                      ).apply { gravity = Gravity.TOP or Gravity.START }
                      try {
                          wm.addView(v, p)
                          blocker = v
                          blocked = true
                          bubble?.let { b ->
                              val bp = bubbleParams
                              try {
                                  wm.removeView(b)
                                  if (bp != null) wm.addView(b, bp)
                              } catch (_: Exception) {}
                          }
                      } catch (_: Exception) {
                          blocked = false
                      }
                  }
                  bubble?.apply {
                      text = if (blocked) "ON" else "TG"
                      background = bg(if (blocked) Color.rgb(190, 55, 45) else Color.rgb(30, 105, 190))
                  }
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int) = START_STICKY
              override fun onDestroy() {
                  blocker?.let { try { wm.removeView(it) } catch (_: Exception) {} }
                  bubble?.let { try { wm.removeView(it) } catch (_: Exception) {} }
                  super.onDestroy()
              }
              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TouchGuard-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
